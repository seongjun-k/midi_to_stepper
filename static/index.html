<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MIDI TO STEPPER</title>
<style>
  :root{
    --bg:#0c0e12;
    --panel:#12151b;
    --panel-2:#171b22;
    --border:#242a35;
    --text:#e6e9ef;
    --text-dim:#8890a0;
    --accent:#3ddc97;
    --accent-dim:#1f5c46;
    --danger:#ff5f5f;
    --warn:#feca57;
    --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button, input, select{font-family:inherit; color:inherit;}
  button{cursor:pointer; -webkit-user-select:none; user-select:none;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  #app{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column;}

  /* ---- 상단바 ---- */
  #topbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-bottom:1px solid var(--border);
    background:var(--panel); flex:0 0 auto; z-index:20;
  }
  #topbar .logo{font-weight:700; letter-spacing:.04em; font-size:14px; color:var(--text-dim);}
  #topbar .logo b{color:var(--accent);}
  .spacer{flex:1;}
  #ws-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); box-shadow:0 0 6px var(--danger); transition:background .2s,box-shadow .2s; flex:0 0 auto;}
  #ws-dot.ok{background:var(--accent); box-shadow:0 0 6px var(--accent);}
  #ws-dot.wait{background:var(--warn); box-shadow:0 0 6px var(--warn);}
  #serial-badge{font-family:var(--mono); font-size:11px; color:var(--text-dim); border:1px solid var(--border); border-radius:4px; padding:3px 7px; white-space:nowrap;}
  #serial-badge.on{color:var(--accent); border-color:var(--accent-dim);}
  #gear-btn{
    width:38px; height:38px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  #gear-btn:active{background:var(--border);}

  /* ---- 화면 스택 ---- */
  #screens{flex:1; min-height:0; position:relative;}
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    padding:20px; overflow:auto;
  }
  .screen.active{display:flex;}

  /* ---- 주크박스 홈 ---- */
  #screen-jukebox{align-items:center; gap:22px;}
  #screen-jukebox .hero{font-size:clamp(15px,3vw,22px); color:var(--text-dim); text-align:center; margin-top:6px;}
  #screen-jukebox .hero b{color:var(--text); display:block; font-size:clamp(24px,5vw,40px); margin-bottom:6px;}
  #jb-strip{
    display:flex; gap:24px; width:100%; overflow-x:auto; overflow-y:hidden;
    padding:14px 4px 24px; scroll-snap-type:x proximity; align-items:flex-start;
  }
  .jb-card{
    flex:0 0 auto; width:168px; display:flex; flex-direction:column; align-items:center;
    gap:12px; background:transparent; border:none; scroll-snap-align:center; cursor:pointer;
  }
  .jb-coverwrap{
    position:relative; width:168px; height:168px; border-radius:50%; overflow:hidden;
    background:var(--panel-2); border:3px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .jb-card:active .jb-coverwrap{border-color:var(--accent);}
  .jb-note{position:absolute; font-size:58px; color:var(--text-dim);}
  .jb-cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .jb-card .jb-title{font-size:15px; font-weight:600; text-align:center; width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .jb-card .jb-artist{font-size:13px; color:var(--text-dim); text-align:center; width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #jb-empty{color:var(--text-dim); text-align:center; padding:30px 0;}
  #search-form{display:flex; gap:10px; width:min(640px, 92vw);}
  #search-input{
    flex:1; padding:18px 18px; font-size:18px; background:var(--panel-2);
    border:1px solid var(--border); border-radius:10px; color:var(--text);
  }
  #search-input:focus{outline:none; border-color:var(--accent);}
  .btn{
    padding:16px 22px; font-size:16px; font-weight:600; border-radius:10px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    min-height:56px;
  }
  .btn:active{background:var(--border);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:#04150e;}
  .btn-danger{border-color:var(--danger); color:var(--danger); background:transparent;}
  .btn-ghost{background:transparent;}
  .btn:disabled{opacity:.4; cursor:default;}

  /* ---- 결과 화면 ---- */
  #screen-results{gap:14px;}
  .results-head{display:flex; align-items:center; gap:12px;}
  .results-head .q{font-family:var(--mono); color:var(--text-dim); font-size:14px;}
  #results-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .result-card{
    display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--border);
    background:var(--panel); border-radius:12px; min-height:72px; text-align:left;
  }
  .result-card:active{background:var(--panel-2); border-color:var(--accent-dim);}
  .result-card img{width:56px; height:56px; border-radius:8px; object-fit:cover; background:var(--panel-2); flex:0 0 auto;}
  .result-card .meta{flex:1; min-width:0;}
  .result-card .title{font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .result-card .artist{font-size:13px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .result-card .dur{font-family:var(--mono); color:var(--text-dim); font-size:13px; flex:0 0 auto;}
  #results-empty{color:var(--text-dim); text-align:center; padding:40px 0;}

  /* ---- 로딩 화면 ---- */
  #screen-loading{align-items:center; justify-content:center; gap:18px;}
  #loading-title{font-size:18px; color:var(--text); text-align:center;}
  .progress-outer{width:min(480px,90vw); height:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .progress-inner{height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); transition:width .25s;}
  #loading-msg{font-family:var(--mono); font-size:13px; color:var(--text-dim);}

  /* ---- 연주 화면 ---- */
  #screen-playing{padding:16px; gap:14px;}
  #now-playing-title{font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #roll-wrap{
    flex:1; min-height:120px; border:1px solid var(--border); border-radius:12px;
    background:radial-gradient(ellipse at 100% 50%, #14181f 0%, #0a0c10 100%);
    position:relative; overflow:hidden;
  }
  #rollCanvas{position:absolute; inset:0; width:100%; height:100%; display:block;}

  #meters{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px;}
  .meter{
    border:1px solid var(--border); background:var(--panel); border-radius:10px;
    padding:8px 10px; display:flex; flex-direction:column; gap:4px; min-width:0;
  }
  .meter .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .meter .name{font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meter .note{font-family:var(--mono); font-size:18px; font-weight:700;}
  .meter .hz{font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  #transport{display:flex; align-items:center; gap:14px;}
  #transport .time{font-family:var(--mono); font-size:14px; color:var(--text-dim); margin-left:auto;}
  #transport .time #time-cur{color:var(--text);}
  /* 유튜브식 얇은 진행선 — 채워진 부분은 --pct 변수로 그린다 */
  #seekbar{
    -webkit-appearance:none; appearance:none; width:100%; height:5px; margin:2px 0;
    border-radius:3px; cursor:pointer;
    background:linear-gradient(to right,
      var(--accent) 0%, var(--accent) var(--pct,0%),
      var(--border) var(--pct,0%), var(--border) 100%);
  }
  #seekbar::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--accent); border:none; box-shadow:0 0 0 3px rgba(0,0,0,.25);
  }
  #seekbar::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background:var(--accent); border:none;
  }
  .tbtn{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel-2); font-size:18px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .tbtn:active{background:var(--border);}
  #back-to-search{align-self:flex-start;}

  /* ---- 설정 패널 ---- */
  #settings-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  #settings-overlay.open{opacity:1; pointer-events:auto;}
  #settings-panel{
    position:fixed; top:0; right:0; height:100%; width:min(420px,92vw);
    background:var(--panel); border-left:1px solid var(--border); z-index:41;
    transform:translateX(100%); transition:transform .25s ease; overflow-y:auto;
    padding:16px; display:flex; flex-direction:column; gap:20px;
  }
  #settings-overlay.open #settings-panel{transform:translateX(0);}
  .settings-head{display:flex; align-items:center; justify-content:space-between;}
  .settings-head h2{font-size:16px; margin:0;}
  section.card{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--panel-2); display:flex; flex-direction:column; gap:8px;}
  section.card h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0;}
  .row{display:flex; gap:8px; align-items:center;}
  .row label{font-size:12px; color:var(--text-dim); min-width:78px;}
  .row input[type=text], .row input[type=number], .row select, .row textarea{
    flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; font-size:13px; color:var(--text);
  }
  textarea{font-family:var(--mono); font-size:12px; min-height:70px; resize:vertical; width:100%;}
  #log-view{
    font-family:var(--mono); font-size:11px; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; height:160px; overflow-y:auto; padding:6px 8px; white-space:pre-wrap; word-break:break-all;
  }
  .small-note{font-size:11px; color:var(--text-dim);}
  .status-line{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .status-line.ok{color:var(--accent);}

  @media (max-width:640px){
    #meters{grid-auto-flow:row; grid-template-columns:repeat(2,1fr);}
    .result-card img{width:44px; height:44px;}
  }
</style>

<div id="app">
  <div id="topbar">
    <div class="logo">MIDI <b>&rarr;</b> STEPPER</div>
    <div class="spacer"></div>
    <div id="serial-badge">시리얼 미연결</div>
    <div id="ws-dot" title="WebSocket 상태"></div>
    <button id="gear-btn" title="설정">&#9881;</button>
  </div>

  <div id="screens">
    <!-- 주크박스 (홈) -->
    <section id="screen-jukebox" class="screen active">
      <div class="hero"><b>연주할 곡을 골라보세요</b>저장된 곡을 누르거나, 검색해서 새 곡을 받아보세요</div>
      <form id="search-form">
        <input id="search-input" type="text" placeholder="곡 제목 또는 아티스트로 검색..." autocomplete="off">
        <button class="btn btn-accent" type="submit">검색</button>
      </form>
      <div id="jb-strip"></div>
      <div id="jb-empty" style="display:none;">저장된 곡이 없습니다. 위에서 검색해 곡을 받아보세요.</div>
    </section>

    <!-- 결과 -->
    <section id="screen-results" class="screen">
      <div class="results-head">
        <button class="btn btn-ghost" id="results-back">&larr; 목록으로</button>
        <span class="q" id="results-query"></span>
      </div>
      <div id="results-list"></div>
      <div id="results-empty" style="display:none;">검색 결과가 없습니다.</div>
    </section>

    <!-- 로딩 -->
    <section id="screen-loading" class="screen">
      <div id="loading-title">변환 준비 중...</div>
      <div class="progress-outer"><div class="progress-inner" id="loading-bar"></div></div>
      <div id="loading-msg">&nbsp;</div>
    </section>

    <!-- 연주 -->
    <section id="screen-playing" class="screen">
      <button class="btn btn-ghost" id="back-to-search">&larr; 목록으로</button>
      <div id="now-playing-title">-</div>
      <div id="roll-wrap"><canvas id="rollCanvas"></canvas></div>
      <input type="range" id="seekbar" min="0" max="1000" value="0">
      <div id="meters"></div>
      <div id="transport">
        <button class="tbtn" id="btn-playpause">&#9658;</button>
        <button class="tbtn" id="btn-stop">&#9632;</button>
        <span class="time"><span id="time-cur">00:00</span> / <span id="time-total">00:00</span></span>
      </div>
    </section>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-panel">
    <div class="settings-head">
      <h2>설정</h2>
      <button class="btn btn-ghost" id="settings-close" style="min-height:36px; padding:6px 12px;">닫기</button>
    </div>

    <section class="card">
      <h3>시리얼 연결</h3>
      <div class="status-line" id="settings-serial-status">미연결</div>
      <div class="row">
        <select id="port-select"></select>
        <button class="btn" id="port-refresh" style="min-height:38px; padding:8px 10px;">&#8635;</button>
      </div>
      <div class="row">
        <button class="btn btn-accent" id="port-connect" style="flex:1; min-height:40px;">연결</button>
        <button class="btn btn-danger" id="port-disconnect" style="flex:1; min-height:40px;">해제</button>
      </div>
    </section>

    <section class="card">
      <h3>MIDI 파일 업로드</h3>
      <input type="file" id="midi-file" accept=".mid,.midi">
      <div class="small-note" id="midi-upload-status">&nbsp;</div>
    </section>

    <section class="card">
      <h3>펌웨어</h3>
      <div class="row">
        <label>ino 경로</label>
        <input type="text" id="fw-path" value="firmware/stepper_ledc/stepper_ledc.ino">
      </div>
      <div class="row">
        <button class="btn" id="fw-compile" style="flex:1; min-height:40px;">컴파일</button>
        <button class="btn btn-accent" id="fw-upload" style="flex:1; min-height:40px;">업로드</button>
      </div>
      <textarea id="fw-output" readonly placeholder="컴파일/업로드 결과..."></textarea>
    </section>

    <section class="card">
      <h3>Config</h3>
      <div class="row"><label>모터 수</label><input type="number" id="cfg-num-motors" min="1" max="8"></div>
      <div class="row"><label>모터 이름</label><input type="text" id="cfg-motor-names" placeholder="쉼표로 구분"></div>
      <div class="row"><label>Baud</label><input type="number" id="cfg-baud"></div>
      <div class="row"><label>FQBN</label><input type="text" id="cfg-fqbn"></div>
      <div class="row"><label>캐시 경로</label><input type="text" id="cfg-cache-dir"></div>
      <button class="btn btn-accent" id="cfg-save">저장</button>
      <div class="small-note" id="cfg-save-status">&nbsp;</div>
    </section>

    <section class="card">
      <h3>로그</h3>
      <div id="log-view"></div>
    </section>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= 공통 상태 ================= */
var CONFIG = null;
var MOTOR_COLORS = ["#ff6b6b","#ff9f43","#feca57","#3ddc97","#1dd1a1","#54a0ff","#5f27cd","#c8d6e5"];
var motorState = [];   // [{segments:[{startT,endT,freq}], lastFreq}]
var appState = { totalMs: 0, playing: false, seekDragging: false, hasStarted: false };

function $(id){ return document.getElementById(id); }

/* ================= 유틸 ================= */
var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function freqToNoteName(f){
  if(!f) return "—";
  var n = Math.round(69 + 12*Math.log2(f/440));
  var name = NOTE_NAMES[((n%12)+12)%12];
  var octave = Math.floor(n/12)-1;
  return name + octave;
}
function fmtTime(ms){
  ms = Math.max(0, ms||0);
  var s = Math.floor(ms/1000);
  var m = Math.floor(s/60);
  s = s%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function logLine(msg){
  var el = $("log-view");
  var line = document.createElement("div");
  line.textContent = "["+new Date().toLocaleTimeString()+"] " + msg;
  el.appendChild(line);
  while(el.childNodes.length > 300) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

/* ================= 화면 전환 ================= */
function showScreen(name){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  $("screen-"+name).classList.add("active");
}

/* ================= 모터 시각화 초기화 ================= */
function initMotors(n){
  motorState = [];
  for(var i=0;i<n;i++) motorState.push({lastFreq:0, eqH:0});
  renderMeterShells();
}
function renderMeterShells(){
  var wrap = $("meters");
  wrap.innerHTML = "";
  var names = (CONFIG && CONFIG.motor_names) || [];
  var n = (CONFIG && CONFIG.num_motors) || motorState.length || 6;
  for(var i=0;i<n;i++){
    var color = MOTOR_COLORS[i % MOTOR_COLORS.length];
    var div = document.createElement("div");
    div.className = "meter";
    div.innerHTML =
      '<div class="name"><span class="dot" style="background:'+color+'"></span>'+
      (names[i] || ("모터 "+(i+1)))+'</div>'+
      '<div class="note" id="meter-note-'+i+'" style="color:'+color+'">—</div>'+
      '<div class="hz" id="meter-hz-'+i+'">0 Hz</div>';
    wrap.appendChild(div);
  }
}
function updateMeters(freqs){
  for(var i=0;i<freqs.length;i++){
    var noteEl = $("meter-note-"+i), hzEl = $("meter-hz-"+i);
    if(!noteEl) continue;
    var f = freqs[i];
    noteEl.textContent = freqToNoteName(f);
    hzEl.textContent = (f ? f : 0) + " Hz";
  }
}
function onFreqs(freqs){
  for(var i=0;i<freqs.length;i++){
    var m = motorState[i];
    if(!m) continue;
    m.lastFreq = freqs[i];
  }
  updateMeters(freqs);
}

/* ================= 피아노롤 캔버스 ================= */
var canvas = $("rollCanvas");
var ctx = canvas.getContext("2d");
// 세로 막대 EQ 매핑 (참조: @local_host_audio_). 실제 주파수 가드는 펌웨어에 있다.
var EQ_FREQ_LO = 55, EQ_FREQ_HI = 2000;   // 막대 높이 log 매핑 구간
var EQ_DIM = "rgba(175,185,205,0.6)";   // Hz 라벨 (중립 회색)
var EQ_MONO = "11px ui-monospace, Menlo, Consolas, monospace";
var dpr = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas(){
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  canvas._cssW = rect.width;
  canvas._cssH = rect.height;
}
window.addEventListener("resize", resizeCanvas);

function freqToBarFrac(f){
  if(!f || f <= 0) return 0;
  var lo = Math.log(EQ_FREQ_LO), hi = Math.log(EQ_FREQ_HI);
  return Math.max(0, Math.min(1, (Math.log(f) - lo) / (hi - lo)));
}
function eqColor(frac, light){   // 음높이→색: 파랑(210) → 분홍(330)
  return "hsl(" + Math.round(210 + frac*120) + ",85%," + (light || 58) + "%)";
}
function drawRoll(){   // 세로 막대 이퀄라이저 (참조: @local_host_audio_)
  requestAnimationFrame(drawRoll);
  var w = canvas._cssW || 0, h = canvas._cssH || 0;
  if(w<=0 || h<=0) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  var n = motorState.length || 1;
  var padX = Math.max(12, w*0.04), padTop = h*0.08, padBot = h*0.16;
  var plotH = h - padTop - padBot, plotW = w - padX*2;
  var gap = Math.min(plotW*0.03, 16), barW = (plotW - gap*(n-1)) / n;
  var baseY = padTop + plotH;

  ctx.strokeStyle = "rgba(255,90,30,0.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, baseY+0.5); ctx.lineTo(w-padX, baseY+0.5); ctx.stroke();

  ctx.font = EQ_MONO; ctx.textAlign = "center";
  for(var i=0;i<n;i++){
    var m = motorState[i];
    var target = freqToBarFrac(m.lastFreq);
    if(m.eqH == null) m.eqH = 0;
    m.eqH += (target - m.eqH) * 0.25;       // 부드러운 상승/하강 (지터 흡수)
    var bh = Math.max(2, m.eqH * plotH);
    var x = padX + i*(barW+gap), y = baseY - bh;
    var on = m.lastFreq > 0;
    ctx.fillStyle = eqColor(target);
    ctx.globalAlpha = on ? 1 : 0.22;
    ctx.fillRect(x, y, barW, bh);
    if(on){ ctx.globalAlpha = 1; ctx.fillStyle = eqColor(target, 80); ctx.fillRect(x, y, barW, 2); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = EQ_DIM;
    ctx.fillText((m.lastFreq || 0) + " Hz", x + barW/2, baseY + 15);
  }
}

/* 재생바 값(0~1000) + 채움(--pct) 동시 갱신 */
function setSeekValue(v){
  var sb = $("seekbar");
  sb.value = String(v);
  sb.style.setProperty("--pct", (v / 10) + "%");
}

/* ================= WebSocket ================= */
var ws = null;
var wsAttempt = 0;
function wsConnect(){
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/ws");
  setWsDot("wait");
  ws.onopen = function(){ wsAttempt = 0; setWsDot("ok"); logLine("WS 연결됨"); };
  ws.onclose = function(){
    setWsDot("bad");
    wsAttempt = Math.min(wsAttempt+1, 6);
    var delay = 500 * Math.pow(2, wsAttempt);
    setTimeout(wsConnect, delay);
  };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  ws.onmessage = function(ev){
    var msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    handleWsMessage(msg);
  };
}
function setWsDot(state){
  var dot = $("ws-dot");
  dot.className = state === "ok" ? "ok" : (state === "wait" ? "wait" : "");
}

function handleWsMessage(msg){
  switch(msg.type){
    case "position":
      if(!appState.seekDragging){
        $("time-cur").textContent = fmtTime(msg.ms);
        if(appState.totalMs > 0) setSeekValue(Math.round((msg.ms/appState.totalMs)*1000));
      }
      break;
    case "freqs":
      onFreqs(msg.freqs);
      break;
    case "progress":
      $("loading-bar").style.width = Math.round((msg.ratio||0)*100) + "%";
      $("loading-msg").textContent = msg.msg || "";
      break;
    case "state":
      if(typeof msg.connected === "boolean") setSerialBadge(msg.connected, msg.port);
      if(typeof msg.playing === "boolean") setPlaying(msg.playing);
      if(msg.loaded){
        appState.totalMs = msg.total_ms || 0;
        $("now-playing-title").textContent = msg.title || "";
        $("time-total").textContent = fmtTime(appState.totalMs);
        setSeekValue(0);
        showScreen("playing");
        resizeCanvas();
        // 로드 완료 -> 자동 재생 (박람회 키오스크 흐름)
        apiPost("/api/play", {start_ms: 0}).then(function(){ appState.hasStarted = true; setPlaying(true); }).catch(function(){});
      }
      break;
    case "log":
      logLine(msg.msg);
      break;
  }
}

/* ================= REST 헬퍼 ================= */
function apiGet(url){
  return fetch(url).then(function(r){
    if(!r.ok) return r.json().catch(function(){return {};}).then(function(b){ throw new Error(b.detail||r.statusText); });
    return r.json();
  });
}
function apiPost(url, body){
  return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})})
    .then(function(r){
      if(!r.ok) return r.json().catch(function(){return {};}).then(function(b){ throw new Error(b.detail||r.statusText); });
      return r.json();
    });
}

/* ================= 검색 / 결과 ================= */
$("search-form").addEventListener("submit", function(e){
  e.preventDefault();
  var q = $("search-input").value.trim();
  if(!q) return;
  $("results-query").textContent = '"' + q + '"';
  $("results-list").innerHTML = "";
  $("results-empty").style.display = "none";
  showScreen("results");
  apiGet("/api/search?q=" + encodeURIComponent(q)).then(function(items){
    renderResults(items || []);
  }).catch(function(err){
    $("results-empty").style.display = "block";
    $("results-empty").textContent = "검색 실패: " + err.message;
  });
});
$("results-back").addEventListener("click", function(){ showScreen("jukebox"); loadLibrary(); });
$("back-to-search").addEventListener("click", function(){ showScreen("jukebox"); loadLibrary(); });

/* ================= 주크박스 라이브러리 ================= */
function loadLibrary(){
  apiGet("/api/library").then(function(items){ renderLibrary(items||[]); })
    .catch(function(){ renderLibrary([]); });
}
function renderLibrary(items){
  var strip = $("jb-strip");
  strip.innerHTML = "";
  $("jb-empty").style.display = items.length ? "none" : "block";
  items.forEach(function(it){
    var card = document.createElement("button");
    card.className = "jb-card";
    var src = it.hasThumb ? ("/api/thumb/" + encodeURIComponent(it.videoId)) : (it.thumbnail || "");
    var cover = '<div class="jb-coverwrap"><span class="jb-note">&#9834;</span>' +
      (src ? '<img class="jb-cover" src="'+escapeHtml(src)+'" onerror="this.remove()">' : '') +
      '</div>';
    card.innerHTML = cover +
      '<div class="jb-title">'+escapeHtml(it.title)+'</div>' +
      '<div class="jb-artist">'+escapeHtml(it.artist||"")+'</div>';
    card.addEventListener("click", function(){ loadTrack(it); });
    strip.appendChild(card);
  });
}

function renderResults(items){
  var list = $("results-list");
  list.innerHTML = "";
  if(!items.length){
    $("results-empty").style.display = "block";
    $("results-empty").textContent = "검색 결과가 없습니다.";
    return;
  }
  items.forEach(function(it){
    var card = document.createElement("button");
    card.className = "result-card";
    var img = "";
    if(it.thumbnail){
      img = '<img src="'+it.thumbnail+'" onerror="this.remove()">';
    }
    card.innerHTML = img +
      '<div class="meta"><div class="title">'+escapeHtml(it.title)+'</div>'+
      '<div class="artist">'+escapeHtml(it.artist||"")+(it.album?(" · "+escapeHtml(it.album)):"")+'</div></div>'+
      '<div class="dur">'+escapeHtml(it.duration||"")+'</div>';
    card.addEventListener("click", function(){ loadTrack(it); });
    list.appendChild(card);
  });
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function loadTrack(it){
  $("loading-title").textContent = it.title + (it.artist ? (" - "+it.artist) : "");
  $("loading-bar").style.width = "0%";
  $("loading-msg").textContent = "시작 중...";
  showScreen("loading");
  apiPost("/api/load", {videoId: it.videoId, title: it.title, artist: it.artist, thumbnail: it.thumbnail || ""})
    .catch(function(err){
      $("loading-msg").textContent = "실패: " + err.message;
    });
}

/* ================= 연주 화면 컨트롤 ================= */
function setPlaying(playing){
  appState.playing = playing;
  $("btn-playpause").innerHTML = playing ? "&#10074;&#10074;" : "&#9658;";
}
$("btn-playpause").addEventListener("click", function(){
  if(appState.playing){
    apiPost("/api/pause").then(function(){ setPlaying(false); }).catch(function(e){ logLine("일시정지 실패: "+e.message); });
  } else if(appState.hasStarted){
    apiPost("/api/resume").then(function(){ setPlaying(true); }).catch(function(e){ logLine("재개 실패: "+e.message); });
  } else {
    apiPost("/api/play", {start_ms: 0}).then(function(){ appState.hasStarted = true; setPlaying(true); }).catch(function(e){ logLine("재생 실패: "+e.message); });
  }
});
$("btn-stop").addEventListener("click", function(){
  apiPost("/api/stop").then(function(){
    setPlaying(false);
    appState.hasStarted = false;
    $("time-cur").textContent = "00:00";
    setSeekValue(0);
  }).catch(function(e){ logLine("정지 실패: "+e.message); });
});
var seekbar = $("seekbar");
seekbar.addEventListener("input", function(){
  appState.seekDragging = true;
  seekbar.style.setProperty("--pct", (seekbar.value/10) + "%");
  $("time-cur").textContent = fmtTime((seekbar.value/1000)*appState.totalMs);
});
seekbar.addEventListener("change", function(){
  var ms = (seekbar.value/1000) * appState.totalMs;
  apiPost("/api/seek", {ms: ms}).finally(function(){ appState.seekDragging = false; });
});

/* ================= 설정 패널 ================= */
function setSerialBadge(connected, port){
  var badge = $("serial-badge");
  badge.textContent = connected ? ("연결됨: " + (port||"")) : "시리얼 미연결";
  badge.className = connected ? "on" : "";
  var s = $("settings-serial-status");
  s.textContent = connected ? ("연결됨 (" + (port||"") + ")") : "미연결";
  s.className = connected ? "status-line ok" : "status-line";
}
$("gear-btn").addEventListener("click", function(){
  $("settings-overlay").classList.add("open");
  refreshPorts();
  loadConfigIntoForm();
});
$("settings-close").addEventListener("click", closeSettings);
$("settings-overlay").addEventListener("click", function(e){
  if(e.target === $("settings-overlay")) closeSettings();
});
function closeSettings(){ $("settings-overlay").classList.remove("open"); }

function refreshPorts(){
  apiGet("/api/ports").then(function(ports){
    var sel = $("port-select");
    sel.innerHTML = "";
    ports.forEach(function(p){
      var opt = document.createElement("option");
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    });
    if(!ports.length){
      var opt = document.createElement("option");
      opt.value = ""; opt.textContent = "(감지된 포트 없음 - 자동탐지 시도)";
      sel.appendChild(opt);
    }
  }).catch(function(e){ logLine("포트 조회 실패: "+e.message); });
}
$("port-refresh").addEventListener("click", refreshPorts);
$("port-connect").addEventListener("click", function(){
  var port = $("port-select").value;
  apiPost("/api/serial/connect", {port: port}).then(function(res){
    setSerialBadge(true, res.port);
    logLine("시리얼 연결: " + res.port);
  }).catch(function(e){ logLine("시리얼 연결 실패: " + e.message); });
});
$("port-disconnect").addEventListener("click", function(){
  fetch("/api/serial/disconnect", {method:"POST"}).then(function(){
    setSerialBadge(false, "");
    logLine("시리얼 연결 해제");
  });
});

/* ---- MIDI 업로드 ---- */
$("midi-file").addEventListener("change", function(){
  var f = this.files[0];
  if(!f) return;
  $("midi-upload-status").textContent = "업로드 중...";
  fetch("/api/midi", {method:"POST", body:f, headers:{"x-filename": f.name}})
    .then(function(r){
      if(!r.ok) return r.json().then(function(b){ throw new Error(b.detail||r.statusText); });
      return r.json();
    })
    .then(function(res){
      $("midi-upload-status").textContent = "완료: 이벤트 " + res.events + "개, " + fmtTime(res.total_ms);
      appState.totalMs = res.total_ms || 0;
      $("now-playing-title").textContent = f.name;
      $("time-total").textContent = fmtTime(appState.totalMs);
      setSeekValue(0);
      closeSettings();
      showScreen("playing");
      resizeCanvas();
      apiPost("/api/play", {start_ms: 0}).then(function(){ appState.hasStarted = true; setPlaying(true); }).catch(function(){});
    })
    .catch(function(e){ $("midi-upload-status").textContent = "실패: " + e.message; });
});

/* ---- 펌웨어 ---- */
$("fw-compile").addEventListener("click", function(){
  $("fw-output").value = "컴파일 중...";
  apiPost2("/api/firmware/compile", {ino_path: $("fw-path").value})
    .then(renderFwResult).catch(function(e){ $("fw-output").value = "오류: " + e.message; });
});
$("fw-upload").addEventListener("click", function(){
  $("fw-output").value = "컴파일 + 업로드 중...";
  apiPost2("/api/firmware/upload", {ino_path: $("fw-path").value})
    .then(renderFwResult).catch(function(e){ $("fw-output").value = "오류: " + e.message; });
});
function apiPost2(url, body){
  // firmware 엔드포인트는 실패해도 200 + ok:false로 응답할 수 있어 apiPost와 분리
  return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(function(r){ return r.json(); });
}
function renderFwResult(res){
  var lines = [];
  lines.push("ok: " + res.ok);
  if(res.stage) lines.push("stage: " + res.stage);
  if("reconnected" in res) lines.push("reconnected: " + res.reconnected);
  if(res.stdout) lines.push("--- stdout ---\n" + res.stdout);
  if(res.stderr) lines.push("--- stderr ---\n" + res.stderr);
  $("fw-output").value = lines.join("\n");
}

/* ---- Config ---- */
function loadConfigIntoForm(){
  apiGet("/api/config").then(function(cfg){
    CONFIG = cfg;
    $("cfg-num-motors").value = cfg.num_motors;
    $("cfg-motor-names").value = (cfg.motor_names||[]).join(", ");
    $("cfg-baud").value = cfg.baud;
    $("cfg-fqbn").value = cfg.fqbn;
    $("cfg-cache-dir").value = cfg.cache_dir;
    initMotors(cfg.num_motors);
  }).catch(function(e){ logLine("config 조회 실패: " + e.message); });
}
$("cfg-save").addEventListener("click", function(){
  var payload = {
    num_motors: parseInt($("cfg-num-motors").value, 10) || 6,
    motor_names: $("cfg-motor-names").value.split(",").map(function(s){return s.trim();}).filter(Boolean),
    baud: parseInt($("cfg-baud").value, 10) || 115200,
    fqbn: $("cfg-fqbn").value,
    cache_dir: $("cfg-cache-dir").value
  };
  fetch("/api/config", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(cfg){
      CONFIG = cfg;
      initMotors(cfg.num_motors);
      $("cfg-save-status").textContent = "저장됨";
      setTimeout(function(){ $("cfg-save-status").textContent = " "; }, 2000);
    })
    .catch(function(e){ $("cfg-save-status").textContent = "실패: " + e.message; });
});

/* ================= 초기화 ================= */
function init(){
  resizeCanvas();
  requestAnimationFrame(drawRoll);
  wsConnect();

  apiGet("/api/config").then(function(cfg){
    CONFIG = cfg;
    initMotors(cfg.num_motors);
  }).catch(function(){ initMotors(6); });

  loadLibrary();

  apiGet("/api/state").then(function(st){
    setSerialBadge(st.connected, st.port);
    setPlaying(st.playing);
    appState.totalMs = st.total_ms || 0;
    $("time-total").textContent = fmtTime(appState.totalMs);
    if(st.loaded_title){
      $("now-playing-title").textContent = st.loaded_title;
      // 주크박스가 홈 — 실제 재생 중일 때만 연주 화면으로. 정지된 채 로드만 된
      // 곡이 홈을 가로채면 다음 관람객이 주크박스를 못 본다.
      if(st.playing){ showScreen("playing"); resizeCanvas(); }
    }
  }).catch(function(e){ logLine("상태 조회 실패: " + e.message); });
}
init();

})();
