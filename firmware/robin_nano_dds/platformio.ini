; MKS Robin Nano v1.2 (STM32F103VET6) — DDS 스텝 펄스 펌웨어
;
; 업로드: pio run 후 .pio/build/robin_nano_dds/firmware.bin 을
;         "Robin_nano35.bin" 이름으로 SD카드 루트에 넣고 보드 전원 인가.
;         MKS 부트로더가 0x0000~0x7000을 쓰므로 오프셋 0x7000으로 빌드한다.
;         (ST-Link 불필요. 실패해도 부트로더가 남아있어 되돌릴 수 있다.)

[env:robin_nano_dds]
platform = ststm32
board = genericSTM32F103VE
framework = arduino

; 플래시 오프셋(0x7000)과 SD카드용 파일명 복사는 이 스크립트가 처리한다.
; board_build.offset 은 이 플랫폼/보드 조합에서 반영되지 않는다 — 스크립트 주석 참고.
; 검증: arm-none-eabi-objdump -h firmware.elf 의 .isr_vector가 08007000이어야 함
; post: 여야 한다 — pre: 로 두면 프레임워크 빌더가 나중에 LINKFLAGS를 덮어써 오프셋이 0으로 돌아간다
extra_scripts = post:offset_and_rename.py

build_flags =
    -O2
    ; 벡터 테이블 위치를 런타임(VTOR)에도 알려준다 — 링커 오프셋과 반드시 같은 값
    -DVECT_TAB_OFFSET=0x7000
    ; native USB CDC. Marlin은 이걸 끄지만(BOARD_NO_NATIVE_USB) Klipper가
    ; 같은 보드에서 USB로 동작하므로 하드웨어 경로는 정상이다.
    -DUSBCON
    -DUSBD_USE_CDC
